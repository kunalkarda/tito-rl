[project]
name = "tito-rl"
version = "0.1.0"
description = "Token-In Token-Out (TITO) RL Training Framework for tool-using LLM agents"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Kunal Karda", email = "kunalkarda21@gmail.com"}
]
keywords = [
    "reinforcement-learning",
    "llm",
    "rlhf",
    "tool-use",
    "agent",
    "token",
    "ppo",
    "grpo",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.41.0",
    "torch>=2.4.0",
]
urls = {
    "Homepage" = "https://github.com/kunalkarda/tito-rl",
    "Repository" = "https://github.com/kunalkarda/tito-rl",
    "Issues" = "https://github.com/kunalkarda/tito-rl/issues",
}

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = ["pytest>=8.0", "ruff"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
